version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_inventario
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventario_tienda
    ports:
      - "3308:3306"
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql

  app:
    build: .
    container_name: app_inventario
    ports:
      - "3000:3000"
    depends_on:
      - mysql