<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Inventario</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Sistema de Inventario de Productos Electrónicos</h1>
      <p class="subtitle">Registro, consulta, edición y eliminación de productos</p>
    </header>

    <section class="panel">
      <div class="panel-top">
        <h2 id="formTitle">Registrar producto</h2>
        <button type="button" id="btnLimpiar" class="btn btn-secondary">Limpiar</button>
      </div>

      <div id="alerta" class="alerta" style="display: none;"></div>

      <form id="productoForm" class="form-grid">
        <input type="hidden" id="productoId" />

        <div class="form-group">
          <label for="nombre">Nombre del producto</label>
          <input type="text" id="nombre" placeholder="Ejemplo: Laptop Gamer" />
          <small class="error-text" id="errorNombre"></small>
        </div>

        <div class="form-group">
          <label for="precio">Precio</label>
          <input type="number" id="precio" step="0.01" placeholder="Ejemplo: 3500" />
          <small class="error-text" id="errorPrecio"></small>
        </div>

        <div class="form-group">
          <label for="stock">Stock</label>
          <input type="number" id="stock" placeholder="Ejemplo: 5" />
          <small class="error-text" id="errorStock"></small>
        </div>

        <div class="form-group">
          <label for="imagen">Imagen</label>
          <input type="text" id="imagen" placeholder="Ejemplo: laptop.jpg" />
          <small class="error-text" id="errorImagen"></small>
        </div>

        <div class="form-actions">
          <button type="submit" id="btnGuardar" class="btn btn-primary">Guardar producto</button>
          <button type="button" id="cancelarEdicion" class="btn btn-warning" style="display: none;">
            Cancelar edición
          </button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-top">
        <h2>Lista de productos</h2>
        <div class="stats">
          <span id="totalProductos">Total productos: 0</span>
          <span id="totalStock">Stock total: 0</span>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Imagen</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductos">
            <tr>
              <td colspan="6" class="empty">No hay productos registrados.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
